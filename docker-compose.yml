# =============================================================================
# AegisLang Docker Compose Configuration
# =============================================================================
#
# The API is self-contained: it stores jobs, documents, clauses, artifacts,
# schemas and traces in SQLite on the `aegislang-data` volume. No external
# database, cache or message broker is required.
#
# Configure secrets in a `.env` file next to this file (see .env.example):
#   AEGISLANG_API_KEYS=your-key      # required unless AEGISLANG_DISABLE_AUTH=true
#   ANTHROPIC_API_KEY=...            # optional; mock parsing is used without an LLM key
#   OPENAI_API_KEY=...               # optional
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # AegisLang API Server
  # ---------------------------------------------------------------------------
  aegislang:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - WORKERS=1
      - LOG_LEVEL=INFO
      - AEGISLANG_STORAGE_BACKEND=sqlite
      - AEGISLANG_SQLITE_PATH=/app/data/aegislang.db
      - AEGISLANG_API_KEYS=${AEGISLANG_API_KEYS:-}
      - AEGISLANG_DISABLE_AUTH=${AEGISLANG_DISABLE_AUTH:-false}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8080
    volumes:
      - aegislang-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Development Only: Hot Reload Server
  # ---------------------------------------------------------------------------
  aegislang-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "8081:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - RELOAD=true
      - WORKERS=1
      - LOG_LEVEL=DEBUG
      - AEGISLANG_DISABLE_AUTH=${AEGISLANG_DISABLE_AUTH:-true}
      - AEGISLANG_API_KEYS=${AEGISLANG_API_KEYS:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./aegislang:/app/aegislang:ro
      - ./templates:/app/templates:ro
    profiles:
      - dev

# =============================================================================
# Volumes
# =============================================================================
volumes:
  aegislang-data:
