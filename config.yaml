# AegisLang Configuration
# Version: 0.1.0
#
# IMPORTANT: This is a REFERENCE configuration file.
# The API server currently uses ENVIRONMENT VARIABLES for configuration.
# This file documents available settings but is NOT automatically loaded.
#
# To configure AegisLang, set the following environment variables:
#   - ANTHROPIC_API_KEY / OPENAI_API_KEY: LLM API credentials
#   - AEGISLANG_STORAGE_BACKEND: Storage backend ("memory" or "sqlite")
#   - AEGISLANG_SQLITE_PATH: SQLite database path (default: aegislang_data.db)
#   - DATABASE_URL: PostgreSQL connection string (Docker Compose stack)
#   - REDIS_URL: Redis connection (Docker Compose stack)
#   - NEO4J_URI, NEO4J_USER, NEO4J_PASSWORD: Graph database credentials (optional)
#   - AEGISLANG_API_KEYS: Comma-separated API keys for authentication
#   - AEGISLANG_DISABLE_AUTH: Set to "true" to disable authentication (dev only)
#   - AEGISLANG_RATE_LIMIT_MINUTE: Requests per minute limit (default: 60)
#   - AEGISLANG_RATE_LIMIT_HOUR: Requests per hour limit (default: 1000)
#   - AEGISLANG_MAX_FILE_SIZE: Max upload size in bytes (default: 52428800)
#   - HOST, PORT, WORKERS: Server configuration
#
# Future versions will add automatic config file loading.
#
# -----------------------------------------------------------------------------
# LLM Configuration
# -----------------------------------------------------------------------------
llm:
  provider: "anthropic"                    # anthropic | openai | local
  model: "claude-sonnet-4-5-20250929"      # Model identifier
  api_key_env: "ANTHROPIC_API_KEY"         # Environment variable for API key
  temperature: 0.1                         # Low temp for consistent extraction
  max_tokens: 4096                         # Maximum response tokens
  timeout_seconds: 60                      # Request timeout
  retry_attempts: 3                        # Retry on transient failures

# -----------------------------------------------------------------------------
# Embedding Configuration
# -----------------------------------------------------------------------------
embeddings:
  model: "text-embedding-3-large"          # Embedding model
  dimensions: 3072                         # Vector dimensions
  batch_size: 100                          # Batch size for bulk embedding

# -----------------------------------------------------------------------------
# Vector Store Configuration (NOT CURRENTLY USED)
# Planned for future versions. Currently uses mock embeddings.
# -----------------------------------------------------------------------------
# vector_store:
#   provider: "pinecone"                   # pinecone | weaviate | qdrant
#   index_name: "aegislang-policies"
#   environment: "us-east-1"
#   api_key_env: "PINECONE_API_KEY"

# -----------------------------------------------------------------------------
# Storage Configuration
# -----------------------------------------------------------------------------
storage:
  backend: "memory"                        # memory | sqlite
  sqlite_path: "aegislang_data.db"         # Path for SQLite database

# -----------------------------------------------------------------------------
# Graph Database Configuration (Provenance)
# -----------------------------------------------------------------------------
graph_store:
  provider: "neo4j"                        # neo4j | arangodb
  uri_env: "NEO4J_URI"
  user_env: "NEO4J_USER"
  password_env: "NEO4J_PASSWORD"

# -----------------------------------------------------------------------------
# Artifact Output Configuration
# -----------------------------------------------------------------------------
artifacts:
  output_dir: "./artifacts/"
  formats:
    - yaml
    - sql
    - python
  naming_pattern: "{doc_id}_{clause_id}.{format}"

# -----------------------------------------------------------------------------
# Validation Configuration
# -----------------------------------------------------------------------------
validation:
  confidence_threshold: 0.85               # Minimum confidence for auto-approval
  review_threshold: 0.70                   # Below this, flag for human review
  block_threshold: 0.50                    # Below this, block artifact

# -----------------------------------------------------------------------------
# Chunking Configuration
# -----------------------------------------------------------------------------
chunking:
  target_tokens: 768                       # Target chunk size
  min_tokens: 256                          # Minimum chunk size
  max_tokens: 1024                         # Maximum chunk size
  overlap_tokens: 64                       # Overlap between chunks

# -----------------------------------------------------------------------------
# Logging Configuration
# -----------------------------------------------------------------------------
logging:
  level: "INFO"                            # DEBUG | INFO | WARNING | ERROR
  format: "json"                           # json | text
  output: "stdout"                         # stdout | file
  file_path: "./logs/aegislang.log"

# -----------------------------------------------------------------------------
# Agent-OS Integration (NOT CURRENTLY USED)
# Planned for future versions. See ROADMAP.md.
# -----------------------------------------------------------------------------
# agent_os:
#   enabled: false
#   event_bus: "redis"                     # redis | kafka | rabbitmq
#   redis_url_env: "REDIS_URL"
#   node_prefix: "aegislang"

# -----------------------------------------------------------------------------
# API Server Configuration
# -----------------------------------------------------------------------------
server:
  host: "0.0.0.0"
  port: 8080
  workers: 4
  cors_origins:
    - "https://app.aegislang.io"
    - "http://localhost:3000"
